*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#17181c;background:#eceef4;display:flex}
aside{width:300px;flex:none;background:#fff;border-right:1px solid #e6e8ef;display:flex;flex-direction:column;height:100%}
aside header{padding:16px 16px 10px}
aside h1{font-size:15px;margin:0 0 2px;color:#253a7e}
aside p{margin:0;color:#6b6f7b;font-size:12px}
#q{margin:8px 16px 10px;padding:8px 10px;border:1px solid #d9dce6;border-radius:8px;font:inherit;width:calc(100% - 32px)}
#list{overflow:auto;flex:1;padding:0 8px 16px}
.g{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#6b6f7b;padding:12px 8px 4px}
.it{display:block;width:100%;text-align:left;border:0;background:none;padding:7px 8px;border-radius:8px;cursor:pointer;font:inherit;color:inherit}
.it:hover{background:#f1f3f9}.it.on{background:#eef1f9;color:#253a7e;font-weight:600}
.it small{display:block;color:#8a8e9b;font-weight:400;font-size:11px}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#ea4c2d;margin-right:6px;vertical-align:middle}
main{flex:1;min-width:0;display:flex;flex-direction:column;height:100%}
.bar{display:flex;gap:8px;align-items:center;padding:10px 16px;background:#fff;border-bottom:1px solid #e6e8ef;flex-wrap:wrap}
.bar b{font-size:13px}.bar span{color:#6b6f7b;font-size:12px;flex:1;min-width:120px}
.bar button,.bar a{border:1px solid #d9dce6;background:#fff;border-radius:8px;padding:6px 10px;font:inherit;cursor:pointer;color:inherit;text-decoration:none;font-size:13px}
.bar button:hover,.bar a:hover{background:#f1f3f9}
#stage{flex:1;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:24px}
#wrap{flex:none;transform-origin:top center;border-radius:28px;background:#fff;box-shadow:0 10px 40px rgba(30,40,80,.18),0 0 0 8px #17181c;overflow:hidden}
#wrap.flat{border-radius:8px;box-shadow:0 6px 24px rgba(30,40,80,.15)}
iframe{display:block;border:0;background:#fff}
@media(max-width:760px){aside{display:none}}
</style>
